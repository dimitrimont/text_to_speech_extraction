<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AnyField Dictation Settings</title>
    <style>
        body {
            width: 250px;
            font-family: -apple-system, sans-serif;
            padding: 16px;
            background: #fdfdfd;
            color: #333;
        }
        h2 { margin-top: 0; font-size: 16px; }
        p { font-size: 13px; color: #555; }
        .toggle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h2>🎤 AnyField Dictation</h2>
    <p>Click on any text field on any website, and click the microphone icon to start dictating.</p>
    
    <div class="toggle-container">
        <span>Enable Extension</span>
        <input type="checkbox" id="enableToggle" checked>
    </div>
</body>
</html>
