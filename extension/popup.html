<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AnyField Dictation</title>
    <style>
        body {
            width: 250px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            padding: 16px;
            background: #fdfdfd;
            color: #333;
            text-align: center;
        }
        h2 { margin-top: 0; font-size: 16px; margin-bottom: 5px; }
        p { font-size: 13px; color: #555; margin-bottom: 20px; }
        
        #force-dictate-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        
        #force-dictate-btn:hover {
            background: #1d4ed8;
        }
        
        #force-dictate-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <h2>🎤 AnyField Dictation</h2>
    <p>Click the microphone in any text field, or force start it below.</p>
    
    <button id="force-dictate-btn">Force Start Dictation</button>

    <script src="popup.js"></script>
</body>
</html>
